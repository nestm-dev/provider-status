packages:
  - "."

# @nestjs/core's postinstall is only a donation banner. tsdown receives
# platform binaries as optional dependencies, so esbuild's script is not needed.
allowBuilds:
  "@nestjs/core": false
  esbuild: false

# A failed npm OIDC attestation must fail rather than silently publishing
# without provenance.
provenance: true

minimumReleaseAgeExclude:
  - "@nestjs/common@12.0.1"
  - "@nestjs/core@12.0.1"
  - "@nestjs/platform-express@12.0.1"
  - "@nestjs/platform-fastify@12.0.1"
  - "@nestjs/testing@12.0.1"
  - "@types/node@26.4.0"
  - ai@7.0.83
